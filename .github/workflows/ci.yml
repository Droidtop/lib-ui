name: CI

# Every implementation of the backend contract is tested against the same fixtures
# (contract/fixtures/answers.json). Work lands on main from ci/* branches once this is
# green (Droidtop/tracker#867 D2).
#
# Consumers: each program that uses lib-ui gets a job here that builds and tests it against
# this commit (#867 D2). No program uses lib-ui yet; the commit that moves a program onto it
# adds that program's job.
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew test apiCheck --stacktrace

  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contract/rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The Rust contract stays compatible within a version: cargo-semver-checks against the last release.
      - uses: taiki-e/install-action@0e09747a63ae497bf945b3dcaf38fef0050d0109 # v2.62.0
        with:
          tool: cargo-semver-checks@0.51.0
      - name: No breaking change without a version that says so
        run: |
          set -eu
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          if [ -z "$last" ]; then echo "nothing released yet; nothing to compare"; exit 0; fi
          cargo semver-checks check-release --baseline-rev "$last"

  # The Kotlin API stays compatible within a version (Droidtop/tracker#867, owner 2026-11-04: "I should be able to
  # bump the version number and immediately get the benefit"): an API line removed since the last release fails
  # unless lib.version is a breaking version and the CHANGELOG says what broke.
  api-compat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/check-api-compat.sh

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -I -m unittest discover -s contract/python -v

  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node --test contract/js/contract.test.mjs

  # A green main whose version has no tag yet is released: CI tags v<version> on this commit, and that tag is
  # what the programs pin (Droidtop/tracker#867 D2). To release, raise lib.version in gradle.properties (and the
  # CHANGELOG) in the change that needs it; the Rust crate's version follows it.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [kotlin, rust, api-compat, python, js]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tag this version if it is new
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          version="$(sed -n 's/^lib\.version=//p' gradle.properties)"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' contract/rust/Cargo.toml | head -1)"
          [ -n "$version" ] || { echo "no lib.version in gradle.properties" >&2; exit 1; }
          [ "$version" = "$crate" ] || { echo "contract/rust is $crate but lib.version is $version" >&2; exit 1; }
          tag="v$version"
          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
            echo "released $tag at $GITHUB_SHA"
          fi
